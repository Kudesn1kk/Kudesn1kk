<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СЕНЧА | Традиция и Качество</title>
    <style>
        body {
            margin: 0;
            background: #1a1c1a url('https://w.forfun.com') no-repeat center center fixed;
            background-size: cover;
            color: #e0e0e0;
            font-family: 'Garamond', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); /* Туманный фильтр */
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 450px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px); /* Эффект матового стекла */
        }
        h1 {
            font-size: 3rem;
            letter-spacing: 10px;
            margin: 0;
            color: #d4d4d4;
            text-transform: uppercase;
            border-bottom: 1px solid #4a5d4a;
            display: inline-block;
            padding-bottom: 10px;
        }
        .description {
            font-style: italic;
            line-height: 1.8;
            margin: 30px 0;
            font-size: 1.1rem;
            color: #a0a0a0;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }
        .btn {
            margin-top: 40px;
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid #d4d4d4;
            color: #d4d4d4;
            text-decoration: none;
            transition: 0.4s;
        }
        .btn:hover { background: #d4d4d4; color: #1a1c1a; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="content">
        <h1>СЕНЧА</h1>
        <p class="description">
            Бережный паровой прогрев листьев.<br>
            100% натуральный продукт.<br>
            Сбор первой страды.
        </p>
        <div class="info-grid">
            <div>Крепость: ●●○</div>
            <div>Регион: Сидзуока</div>
            <div>Темп: 80°C</div>
            <div>Время: 90 сек</div>
        </div>
        <a href="#" class="btn">ОСОЗНАТЬ ВКУС</a>
    </div>
</body>
</html>
