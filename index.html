<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SENCHA | AWARENESS</title>
    <style>
        /* Весь CSS должен быть ТУТ */
        body {
            background: #050505 url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #d1d1d1;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        /* Затемнение, чтобы текст читался поверх Фудзи */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); 
            z-index: -2;
        }

        .steam-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05), transparent 50%);
            filter: blur(60px);
            z-index: -1;
            animation: smokeMove 15s infinite alternate ease-in-out;
        }

        @keyframes smokeMove {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.2); opacity: 0.6; }
        }

        .content { max-width: 500px; padding: 40px; margin-top: 10vh; }
        h1 { font-size: 3rem; letter-spacing: 15px; color: #fff; }
        .timer-btn { background: none; border: 1px solid #fff; color: #fff; padding: 15px 30px; cursor: pointer; margin-top: 30px; transition: 0.5s; }
        .timer-btn:hover { background: #fff; color: #000; box-shadow: 0 0 20px #fff; }
    </style>
</head>
<body>
    <div class="steam-overlay"></div>
    <div class="content">
        <h1>СЕНЧА</h1>
        <p>СБОР ПЕРВОЙ СТРАДЫ. СИДЗУОКА.</p>
        <hr style="border: 0.5px solid #444; margin: 20px 0;">
        <p>Этот чай был обработан паром, чтобы остановить время и сохранить вкус. Как и ты сейчас — остановись и осознай.</p>
        
        <div style="text-align: left; font-size: 12px; border-left: 1px solid #555; padding-left: 15px; margin: 20px 0;">
            <p style="color: #777;">[ DATA ] ORIGIN: SHIZUOKA, JAPAN</p>
            <p>Чай выращен у подножия горы Фудзи. Метод "Фукамуси" останавливает ферментацию за секунды.</p>
        </div>

        <button class="timer-btn" onclick="startTimer()">РИТУАЛ ЗАВАРИВАНИЯ</button>
        <div id="countdown" style="font-size: 2rem; margin-top: 20px; display: none;">90s</div>
    </div>

    <script>
        function startTimer() {
            let time = 90;
            const display = document.getElementById('countdown');
            display.style.display = 'block';
            setInterval(() => {
                if (time > 0) { time--; display.innerText = time + 's'; }
                else { display.innerText = "ОСОЗНАНО"; }
            }, 1000);
        }
    </script>
</body>
</html>
