<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENCHA | AWARENESS</title>
    <style>
        @import url('https://fonts.googleapis.com');

        body {
            background: #1a1a1a url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #2b2b2b;
            font-family: 'Noto Serif JP', serif;
            margin: 0; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }

        /* ЗАТЕМНЕНИЕ ФОНА (НЕ БЛОКИРУЕТ КЛИКИ) */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); 
            z-index: 1; 
            pointer-events: none; /* ГЛАВНЫЙ ФИКС ДЛЯ КНОПОК */
        }

        h1 {
            font-size: clamp(3rem, 10vw, 5rem); letter-spacing: 20px;
            color: #fff; margin: 40px 0; font-weight: 200;
            text-shadow: 0 0 20px rgba(0,0,0,0.5); text-transform: uppercase;
            position: relative; z-index: 10;
        }

        .slider-container {
            width: 95%; max-width: 700px; margin: 20px auto;
            position: relative; z-index: 10;
        }

        /* ТВОЙ СВИТОК */
        #scroll-page {
            background: url('scroll.png') no-repeat center;
            background-size: contain;
            min-height: 400px;
            padding: 80px 20%;
            display: flex; flex-direction: column; justify-content: center;
            text-align: center;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 15px 40px rgba(0,0,0,0.6));
        }

        #slide-title { font-size: 1.3rem; margin-bottom: 10px; color: #2b1d14; font-weight: bold; border-bottom: 1px solid rgba(0,0,0,0.1); display: inline-block; }
        #slide-text { font-size: 0.9rem; line-height: 1.6; color: #3e2723; font-style: italic; }

        /* СТРЕЛКИ (Z-INDEX 9999) */
        .arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.5);
            color: #fff; font-size: 2.5rem; cursor: pointer;
            z-index: 9999; /* ВЫШЕ ВСЕХ СЛОЕВ */
            width: 50px; height: 50px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s; backdrop-filter: blur(5px);
            user-select: none;
        }
        .arrow:hover { background: #fff; color: #000; scale: 1.1; }
        .prev { left: -25px; } .next { right: -25px; }

        /* КНОПКА РИТУАЛА */
        .timer-btn {
            position: relative; z-index: 9999;
            background: none; border: 1px solid #fff; color: #fff;
            padding: 15px 40px; cursor: pointer; margin-top: 30px;
            letter-spacing: 5px; font-size: 0.9rem; transition: 0.5s;
            text-transform: uppercase;
        }
        .timer-btn:hover { background: #fff; color: #000; box-shadow: 0 0 30px #fff; }

        #countdown { font-size: 3rem; color: #fff; margin-top: 20px; font-weight: 200; letter-spacing: 10px; position: relative; z-index: 9999; }
    </style>
</head>
<body>
    <h1>СЕНЧА</h1>

    <div class="slider-container">
        <button class="arrow prev" onclick="changeSlide(-1)">‹</button>
        <button class="arrow next" onclick="changeSlide(1)">›</button>
        <div id="scroll-page">
            <h3 id="slide-title">ОСНОВА: СЕНЧА</h3>
            <p id="slide-text">Бережный паровой прогрев листьев останавливает время, сохраняя 100% натуральный вкус первой страды.</p>
        </div>
    </div>

    <button class="timer-btn" onclick="startTimer()">РИТУАЛ</button>
    <div id="countdown" style="display: none;">90S</div>

    <script>
        const slides =;
        let cur = 0;
        function changeSlide(d) {
            cur = (cur + d + slides.length) % slides.length;
            const p = document.getElementById('scroll-page');
            p.style.opacity = 0;
            setTimeout(() => {
                document.getElementById('slide-title').innerText = slides[cur].title;
                document.getElementById('slide-text').innerText = slides[cur].text;
                p.style.opacity = 1;
            }, 300);
        }
        function startTimer() {
            let t = 90;
            const d = document.getElementById('countdown');
            d.style.display = 'block';
            document.querySelector('.timer-btn').style.display = 'none';
            const i = setInterval(() => {
                t--; d.innerText = t + "S";
                if (t <= 0) { clearInterval(i); d.innerText = "ГОТОВО"; }
            }, 1000);
        }
    </script>
</body>
</html>
