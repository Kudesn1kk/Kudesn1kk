<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENCHA | AWARENESS</title>
    <style>
        /* БАЗА И ФОН */
        body {
            background: #050505 url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #d1d1d1;
            font-family: 'Courier New', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            text-align: center;
        }

        /* ЗАТЕМНЕНИЕ */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65); z-index: -2;
        }

        /* ДЫМ / ПАР */
        .steam-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 120%, rgba(255,255,255,0.1), transparent 60%);
            filter: blur(60px); z-index: -1; animation: smokeMove 12s infinite alternate ease-in-out;
            pointer-events: none;
        }
        @keyframes smokeMove { from { opacity: 0.3; transform: scale(1); } to { opacity: 0.6; transform: scale(1.1); } }

        /* КОНТЕЙНЕР */
        .container {
            width: 90%; max-width: 600px; padding: 20px; margin-top: 5vh; z-index: 10;
        }

        h1 { font-size: 2.2rem; letter-spacing: 12px; margin-bottom: 20px; color: #fff; }

        /* СЛАЙДЕР С БУМАГОЙ */
        .slider-container { position: relative; width: 100%; margin: 30px 0; }

        #scroll-page {
            background: url('scroll.png') no-repeat center;
            background-size: contain;
            min-height: 320px;
            padding: 60px 15%; /* Отступы чтобы текст был на бумаге */
            display: flex; flex-direction: column; justify-content: center;
            
            /* ЦВЕТ ТЕКСТА (Темно-коричневый как старые чернила) */
            color: #3e2723; 
            text-shadow: none;
            transition: opacity 0.4s ease;
        }

        #slide-title { font-family: serif; font-size: 1.2rem; margin-bottom: 10px; font-weight: bold; }
        #slide-text { font-size: 0.9rem; line-height: 1.5; font-style: italic; }

        /* СТРЕЛКИ */
        .arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #fff; font-size: 40px; cursor: pointer;
            z-index: 15; opacity: 0.6; transition: 0.3s;
        }
        .arrow:hover { opacity: 1; transform: translateY(-50%) scale(1.2); }
        .prev { left: -10px; } .next { right: -10px; }

        /* КНОПКА ТАЙМЕРА */
        .timer-btn {
            background: none; border: 1px solid #fff; color: #fff;
            padding: 15px 30px; cursor: pointer; margin-top: 20px;
            width: 100%; max-width: 280px; letter-spacing: 2px; transition: 0.5s;
        }
        .timer-btn:hover { background: #fff; color: #000; box-shadow: 0 0 25px #fff; }

        #countdown { font-size: 2rem; margin-top: 20px; color: #fff; }
    </style>
</head>
<body>
    <div class="steam-overlay"></div>
    
    <div class="container">
        <h1>СЕНЧА</h1>

        <div class="slider-container">
            <button class="arrow prev" onclick="changeSlide(-1)">‹</button>
            <button class="arrow next" onclick="changeSlide(1)">›</button>
            <div id="scroll-page">
                <h3 id="slide-title">ЛОКАЦИЯ: СИДЗУОКА</h3>
                <p id="slide-text">Чай выращен у подножия горы Фудзи. Уникальный климат создает "холодный" вкус первой страды.</p>
            </div>
        </div>

        <button class="timer-btn" onclick="startTimer()">РИТУАЛ ЗАВАРИВАНИЯ</button>
        <div id="countdown" style="display: none;">90s</div>
    </div>

    <script>
        const slides = [
            { title: "ЛОКАЦИЯ: СИДЗУОКА", text: "Префектура Сидзуока поставляет 40% всего чая Японии. Почва здесь богата минералами вулкана." },
            { title: "МЕТОД: ФУКАМУСИ", text: "Глубокое пропаривание (90 сек) делает лист хрупким, а настой — густым и ярко-зеленым." },
            { title: "РИТУАЛ: ВКУС", text: "Сенча первой страды имеет баланс сладости и терпкости. Это вкус 'Умами', который нужно осознать." }
        ];
        let cur = 0;
        function changeSlide(d) {
            cur = (cur + d + slides.length) % slides.length;
            const p = document.getElementById('scroll-page');
            p.style.opacity = 0;
            setTimeout(() => {
                document.getElementById('slide-title').innerText = slides[cur].title;
                document.getElementById('slide-text').innerText = slides[cur].text;
                p.style.opacity = 1;
            }, 400);
        }
        function startTimer() {
            let t = 90;
            const d = document.getElementById('countdown');
            d.style.display = 'block';
            const i = setInterval(() => {
                t--; d.innerText = t + 's';
                if (t <= 0) { clearInterval(i); d.innerText = "ОСОЗНАНО"; }
            }, 1000);
        }
    </script>
</body>
</html>
