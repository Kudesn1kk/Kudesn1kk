<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ОСОЗНАТЬ ВКУС</title>
    <style>
        /* Это CSS - "кожа" твоего сайта */
        body {
            background-color: #000; /* Истинный черный */
            color: #d1d1d1; /* Серебряный текст */
            font-family: 'Times New Roman', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-transform: uppercase;
        }

        h1 {
            font-size: 60px;
            letter-spacing: 15px;
            font-weight: normal;
            margin-bottom: 20px;
        }

        .line {
            width: 400px;
            height: 1px;
            background-color: #333;
            margin: 25px 0;
        }

        p {
            font-size: 14px;
            letter-spacing: 2px;
            margin: 10px 0;
        }

        .stats {
            display: flex;
            gap: 60px;
            font-size: 12px;
            margin-top: 20px;
        }

        button {
            background: none;
            border: 1px solid #d1d1d1;
            color: #d1d1d1;
            padding: 15px 50px;
            margin-top: 50px;
            cursor: pointer;
            transition: 0.3s; /* Плавность 144 Гц */
        }

        button:hover {
            background-color: #d1d1d1;
            color: #000;
        }
    </style>
</head>
<body>

    <h1>СЕНЧА</h1>

    <div class="line"></div>

    <p><i>Бережный паровой прогрев листьев</i></p>
    <p>100% натуральный продукт</p>
    <p>Сбор первой страды</p>

    <div class="line"></div>

    <div class="stats">
        <div>КРЕПОСТЬ: ●●○</div>
        <div>РЕГИОН: СИДЗУОКА</div>
    </div>
    
    <div class="stats" style="margin-top: 10px;">
        <div>ТЕМП: 80°C</div>
        <div>ВРЕМЯ: 90 СЕК</div>
    </div>

    <button>ОСОЗНАТЬ ВКУС</button>

</body>
</html>
