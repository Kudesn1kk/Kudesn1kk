<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAOLIN | THE SPIRIT</title>
    <style>
        @import url('https://fonts.googleapis.com');

        /* БАЗА И ФОН */
        body {
            background: #0a0f0a url('bg_dota.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            text-transform: uppercase;
        }

        /* КОМИКСНАЯ СЕТКА И ЗАТЕМНЕНИЕ */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, #000 90%), 
                        url('https://www.transparenttextures.com');
            opacity: 0.8; z-index: -2;
        }

        /* ПУЛЬСАЦИЯ ЧАСТИЦ (EARTH SPIRIT VIBE) */
        .particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 255, 100, 0.08), transparent 60%);
            z-index: -1; animation: pulse 4s infinite alternate;
            pointer-events: none;
        }
        @keyframes pulse { from { opacity: 0.3; } to { opacity: 0.6; } }

        .container {
            width: 95%; max-width: 850px; padding: 20px;
            margin-top: 5vh; z-index: 10;
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: clamp(3.5rem, 12vw, 6.5rem);
            color: #00ff64;
            text-shadow: 5px 5px 0px #000, 0 0 25px rgba(0, 255, 100, 0.6);
            margin: 0;
            transform: rotate(-3deg);
            letter-spacing: 5px;
        }

        /* КАМЕННАЯ ПЛИТА (REMNANT) */
        .slider-container { position: relative; width: 100%; margin: 30px 0; }

        #scroll-page {
            background: url('stone.png') no-repeat center;
            background-size: contain;
            min-height: clamp(350px, 60vh, 500px);
            /* ОТСТУПЫ: чтобы текст сидел внутри трещин твоей плиты */
            padding: 10% 18%;
            display: flex; flex-direction: column; justify-content: center;
            
            /* ТЕКСТ: НЕОНОВЫЙ ЗЕЛЕНЫЙ */
            color: #00ff64;
            text-shadow: 2px 2px 0px #000, 0 0 10px rgba(0, 255, 100, 0.4);
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.9));
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
        }

        #slide-title { font-size: clamp(1.2rem, 5vw, 1.8rem); margin-bottom: 10px; border-bottom: 2px solid #00ff64; display: inline-block; }
        #slide-text { font-size: clamp(0.85rem, 3vw, 1.05rem); line-height: 1.4; color: #fff; font-weight: 900; }

        /* КНОПКИ-СТРЕЛКИ (COMIC STYLE) */
        .arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: #00ff64; border: 4px solid #000; color: #000; font-family: 'Bangers';
            font-size: 2.5rem; cursor: pointer; z-index: 20; padding: 0 20px;
            box-shadow: 6px 6px 0px #000; transition: 0.2s;
            user-select: none;
        }
        .arrow:hover { background: #fff; transform: translateY(-50%) scale(1.1); box-shadow: 3px 3px 0px #000; }
        .arrow:active { transform: translateY(-50%) translate(2px, 2px); box-shadow: 1px 1px 0px #000; }
        .prev { left: -15px; } .next { right: -15px; }

        /* КНОПКА ТАЙМЕРА (ULTIMATE) */
        .timer-btn {
            background: #00ff64; border: 5px solid #000; color: #000;
            padding: 20px 40px; cursor: pointer; margin-top: 20px;
            font-family: 'Bangers'; font-size: 1.8rem; letter-spacing: 3px;
            box-shadow: 10px 10px 0px #000; transition: 0.2s;
            width: 100%; max-width: 350px;
        }
        .timer-btn:hover { background: #fff; transform: translate(-4px, -4px); box-shadow: 14px 14px 0px #000; }
        .timer-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000; }

        #countdown { font-family: 'Bangers'; font-size: 5rem; color: #00ff64; margin-top: 20px; text-shadow: 4px 4px 0px #000; }
    </style>
</head>
<body>
    <div class="particles"></div>
    
    <div class="container">
        <h1>EARTH SPIRIT</h1>

        <div class="slider-container">
            <button class="arrow prev" onclick="changeSlide(-1)">‹</button>
            <button class="arrow next" onclick="changeSlide(1)">›</button>
            <div id="scroll-page">
                <h3 id="slide-title">ABILITY: GEOMAGNETIC GRIP</h3>
                <p id="slide-text">Каолин притягивает каменную копию. Враги на пути получают безмолвие. Осознай силу контроля и доминируй.</p>
            </div>
        </div>

        <button class="timer-btn" onclick="startTimer()">ACTIVATE REMNANT</button>
        <div id="countdown" style="display: none;">90S</div>
    </div>

    <script>
        const slides =;
        let cur = 0;
        function changeSlide(d) {
            cur = (cur + d + slides.length) % slides.length;
            const p = document.getElementById('scroll-page');
            p.style.transform = "skewX(12deg) scale(0.9)";
            p.style.opacity = 0;
            setTimeout(() => {
                document.getElementById('slide-title').innerText = slides[cur].title;
                document.getElementById('slide-text').innerText = slides[cur].text;
                p.style.transform = "skewX(0deg) scale(1)";
                p.style.opacity = 1;
            }, 250);
        }
        function startTimer() {
            let t = 90;
            const d = document.getElementById('countdown');
            d.style.display = 'block';
            const i = setInterval(() => {
                t--; d.innerText = t + "S";
                if (t <= 0) { clearInterval(i); d.innerText = "MAGNETIZED"; }
            }, 1000);
        }
    </script>
</body>
</html>
