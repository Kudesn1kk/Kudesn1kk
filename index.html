<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENCHA | AWARENESS</title>
    <style>
        @import url('https://fonts.googleapis.com');

        body {
            background: #1a1a1a url('bg.jpg') no-repeat center center fixed; /* Твое фото с самураем */
            background-size: cover;
            color: #2b2b2b;
            font-family: 'Noto Serif JP', serif;
            margin: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }

        /* ЭФФЕКТ ТУМАНА */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(2px); z-index: -1;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 5rem);
            letter-spacing: 20px;
            color: #fff;
            margin: 40px 0;
            font-weight: 200;
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .slider-container { width: 90%; max-width: 600px; margin: 20px auto; position: relative; }

        /* РИСОВАЯ БУМАГА (СВИТОК) */
        #scroll-page {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 10%;
            border-radius: 2px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            min-height: 300px;
            display: flex; flex-direction: column; justify-content: center;
            text-align: center;
            transition: 0.5s;
            border: 1px solid rgba(0,0,0,0.1);
        }

        #slide-title { font-size: 1.4rem; margin-bottom: 15px; border-bottom: 1px solid #999; display: inline-block; padding-bottom: 5px; }
        #slide-text { font-size: 1rem; line-height: 1.8; color: #444; font-style: italic; }

        .arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #fff; font-size: 3rem;
            cursor: pointer; z-index: 10; opacity: 0.5; transition: 0.3s;
        }
        .arrow:hover { opacity: 1; transform: translateY(-50%) scale(1.1); }
        .prev { left: -50px; } .next { right: -50px; }

        .timer-btn {
            background: none; border: 1px solid #fff; color: #fff;
            padding: 15px 40px; cursor: pointer; margin-top: 30px;
            letter-spacing: 5px; font-size: 0.9rem; transition: 0.5s;
            text-transform: uppercase;
        }
        .timer-btn:hover { background: #fff; color: #000; }

        #countdown { font-size: 3rem; color: #fff; margin-top: 20px; font-weight: 200; }
    </style>
</head>
<body>
    <h1>СЕНЧА</h1>

    <div class="slider-container">
        <button class="arrow prev" onclick="changeSlide(-1)">‹</button>
        <button class="arrow next" onclick="changeSlide(1)">›</button>
        <div id="scroll-page">
            <h3 id="slide-title">ОСНОВА: СЕНЧА</h3>
            <p id="slide-text">Бережный паровой прогрев листьев останавливает время, сохраняя 100% натуральный вкус первой страды.</p>
        </div>
    </div>

    <button class="timer-btn" onclick="startTimer()">РИТУАЛ</button>
    <div id="countdown" style="display: none;">90S</div>

    <script>
        const slides =;
        let cur = 0;
        function changeSlide(d) {
            cur = (cur + d + slides.length) % slides.length;
            const p = document.getElementById('scroll-page');
            p.style.opacity = 0;
            setTimeout(() => {
                document.getElementById('slide-title').innerText = slides[cur].title;
                document.getElementById('slide-text').innerText = slides[cur].text;
                p.style.opacity = 1;
            }, 300);
        }
        function startTimer() {
            let t = 90;
            const d = document.getElementById('countdown');
            d.style.display = 'block';
            document.querySelector('.timer-btn').style.display = 'none';
            const i = setInterval(() => {
                t--; d.innerText = t + "S";
                if (t <= 0) { clearInterval(i); d.innerText = "ГОТОВО"; }
            }, 1000);
        }
    </script>
</body>
</html>
